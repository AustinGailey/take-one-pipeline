<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" width="1600" height="840" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Take One pipeline: stages S0 to S7, the QA gate after each, and the four owner decisions</title>
<desc id="d">Eight stages in a row from Research to Measure. Under each stage is the independent QA gate that checks its hand-off; Design has two. Above Plan, Design, Package and Publish are the four decisions only the owner can make. Agent writes pass a lane check before they reach the store. Measure feeds rules back to Research.</desc>
