<text x="60" y="84" fill="#F4F5F7" font-size="40" font-weight="800" letter-spacing="-0.5">take-one-pipeline</text>
<text x="60" y="122" fill="#9AA4B2" font-size="21">8 stages · 10 agent profiles · 9 independent gates · 4 decisions only the owner makes</text>
<text x="60" y="226" fill="#F97316" font-size="15" font-weight="700" letter-spacing="1.5">OWNER</text>
<text x="60" y="247" fill="#9AA4B2" font-size="13.5">the only waits</text>
<text x="60" y="265" fill="#9AA4B2" font-size="13.5">on a person</text>
<text x="60" y="334" fill="#F4F5F7" font-size="15" font-weight="700" letter-spacing="1.5">STAGES</text>
<text x="60" y="355" fill="#9AA4B2" font-size="13.5">one profile,</text>
<text x="60" y="373" fill="#9AA4B2" font-size="13.5">one write lane</text>
<text x="60" y="492" fill="#7DD3A8" font-size="15" font-weight="700" letter-spacing="1.5">QA GATES</text>
<text x="60" y="513" fill="#9AA4B2" font-size="13.5">a separate job,</text>
<text x="60" y="531" fill="#9AA4B2" font-size="13.5">never the producer</text>
