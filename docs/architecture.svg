<rect x="470.0" y="577" width="800" height="34" rx="6" fill="#0B0D10"/>
<text x="870.0" y="600" fill="#9AA4B2" font-size="16" text-anchor="middle">LEARN: results and escapes go back to the stage that owns them, as rule changes and new checks</text>
<rect x="60.0" y="644" width="477.3333333333333" height="146" rx="12" fill="#14181D" stroke="#2A313A" stroke-width="1.5"/>
<rect x="60.0" y="662" width="4" height="26" fill="#F97316"/>
<text x="82.0" y="682" fill="#F4F5F7" font-size="20" font-weight="700">Producer ≠ checker</text>
<text x="82.0" y="712" fill="#9AA4B2" font-size="15.5">Only the qa lane may write projects/{key}/qa/*, and only</text>
<text x="82.0" y="735" fill="#9AA4B2" font-size="15.5">as create. A producer that writes its own pass is</text>
<text x="82.0" y="758" fill="#9AA4B2" font-size="15.5">dropped at collect.</text>
<rect x="561.3333333333333" y="644" width="477.3333333333333" height="146" rx="12" fill="#14181D" stroke="#2A313A" stroke-width="1.5"/>
<rect x="561.3333333333333" y="662" width="4" height="26" fill="#F97316"/>
<text x="583.3333333333333" y="682" fill="#F4F5F7" font-size="20" font-weight="700">A failed gate holds the hand-off</text>
<text x="583.3333333333333" y="712" fill="#9AA4B2" font-size="15.5">It raises one fix-or-waive card for the owner. Fix goes</text>
<text x="583.3333333333333" y="735" fill="#9AA4B2" font-size="15.5">back to the producer and the gate runs again. A waiver</text>
<text x="583.3333333333333" y="758" fill="#9AA4B2" font-size="15.5">is logged on the run.</text>
<rect x="1062.6666666666665" y="644" width="477.3333333333333" height="146" rx="12" fill="#14181D" stroke="#2A313A" stroke-width="1.5"/>
<rect x="1062.6666666666665" y="662" width="4" height="26" fill="#F97316"/>
<text x="1084.6666666666665" y="682" fill="#F4F5F7" font-size="20" font-weight="700">A miss becomes a check</text>
<text x="1084.6666666666665" y="712" fill="#9AA4B2" font-size="15.5">Anything a person catches after a gate passed is logged</text>
<text x="1084.6666666666665" y="735" fill="#9AA4B2" font-size="15.5">as an escape and ends in a new check, or a written</text>
<text x="1084.6666666666665" y="758" fill="#9AA4B2" font-size="15.5">reason it cannot be automated.</text>
</svg>
